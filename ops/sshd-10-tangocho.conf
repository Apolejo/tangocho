# /etc/ssh/sshd_config.d/10-tangocho.conf (docs/ORACLE.md). sshd keeps the first value it reads
# and reads this folder in name order, so 10- comes before Ubuntu's 60-cloudimg-settings.conf.
# Passwords are already off there; keys only.
PermitRootLogin no
X11Forwarding no

# CI's deploy key: its line in this root-owned file carries restrict,command="/usr/local/bin/tangocho-deploy",
# and the deploy user can't change it.
Match User deploy
	AuthorizedKeysFile /etc/ssh/tangocho/deploy.pub
	AllowAgentForwarding no
	AllowTcpForwarding no
	PermitTTY no
	X11Forwarding no
