# Word reports (SPEC §5.7). The ⚑ in the app opens this form with the fields below filled in,
# each by its id (src/reports/report.ts), and the form labels the issue itself, whoever sends it.
# Keep the ids in step with REPORT_FIELDS; src/reports/report.test.ts checks them.
name: Word report
description: A mistake in a word of the notebook. Easiest from the ⚑ next to the word in the app.
title: 'Word report: '
labels: [word-report]
body:
  - type: markdown
    attributes:
      value: |
        The app filled in what it showed. Say below what looks wrong; the rest can stay as it is.
        La app rellenó lo que mostraba. Explica abajo qué parece estar mal; lo demás puede quedarse así.
  - type: input
    id: word-id
    attributes:
      label: Word id / Id de la palabra
  - type: input
    id: shown
    attributes:
      label: Shown as / Se muestra como
  - type: input
    id: meaning
    attributes:
      label: Meaning / Significado
  - type: input
    id: form
    attributes:
      label: Form / Forma
  - type: input
    id: answer
    attributes:
      label: App’s answer / Respuesta de la app
  - type: input
    id: from
    attributes:
      label: Reported from / Reportado desde
  - type: input
    id: source
    attributes:
      label: Notebook page / Página del cuaderno
  - type: textarea
    id: wrong
    attributes:
      label: What looks wrong? / ¿Qué parece estar mal?
    validations:
      required: true
